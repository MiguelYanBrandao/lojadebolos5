!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playwrite+IE+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>Tela de Login</title>
</head>
<body>
    <section class="formulario">
        <div class="interface">
            <div class="flex">
                <h1>Tela de <span>Login</span></h1>
                <p>preencha o campo abaixo para continuar!</p>
                <form action="">
                    <input type="text" name="" id="" placeholder="Seu email">
                    <input type="password" name="" id="" placeholder="Sua senha">
                  <div class="btn-enviar"><a href="produtos.htm"><input type="button" value="Enviar"></a></div>

                </form>


            </div>


        </div>


    </section>
    
</body>
</html>
<style>
    *{
        margin: 0 auto;
        padding: 0 auto;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }
    body{
        background-color: rgb(255, 0, 170);
        height: 100vh;

    }
    .interface{
        max-width: 1280px;
        

    }
    .flex{
        
    }
    h1, p{
        color: #fff;
        font-size: 42px;
        text-align: center;
        text-shadow: 0px 0px 8px #000;
    }
    h1 span{
        color: #ff01aa;

    }
    section.formulario{
        margin-top: 200px;
        
    }
    form{
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        margin-top: 40px;
    }
    form input{
        max-width: 100%;
        background-color: rgba(0, 0, 0, 0.212);
        border: 0;
        outline: 0;
        padding: 20px 15px;
        border-radius: 15px;
        color: #fff;
        font-size: 18px;

    }
    form .btn-enviar{
        max-width: 500px;
        background-color: #0000003a;
    }



</style>
